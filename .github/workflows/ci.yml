name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    # Linux only: the suite checks browser behavior, which does not depend on the runner's OS, and
    # local development already runs it on Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Install pnpm from packageManager and wait for the frozen installation before checks or cache
      # persistence can start.
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test:uncompiled
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test
      # Builds the Storybook catalog and runs its Playwright suite, so broken stories or controls fail CI too.
      - run: pnpm test:storybook
