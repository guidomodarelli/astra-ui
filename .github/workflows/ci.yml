name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs this same CI on the exact release commit, so a later push to main
  # that cancels the push run of that commit does not block the publication.
  workflow_call:
    inputs:
      ref:
        description: "Commit to validate"
        required: true
        type: string
permissions:
  contents: read
# A new run cancels the previous run on the same ref (a pull request or main). A run called by
# Release gets its own group per commit, so pushes never cancel it.
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Linux only: the suite checks browser behavior, which does not depend on the runner's OS, and
    # local development already runs it on Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Empty on push and pull_request, so checkout uses the commit of the event.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Install pnpm from packageManager and wait for the frozen installation before checks or cache
      # persistence can start.
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test:uncompiled
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Builds the Storybook catalog and runs its Playwright suite, so broken stories or controls fail CI too.
      - run: pnpm test:storybook

  browser:
    # The browser suite is the slowest step: each shard gets its own runner, so the shards add CPU
    # instead of sharing the 4 vCPU of a single runner.
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      # The browser fixtures import the built package from dist.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
