name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_unpublished:
        description: Omitir el tag del registry anterior durante una migración autorizada
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: beez-ui-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the npm client for trusted publishing
        run: npm install --global npm@11.5.1
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create and publish release
        shell: bash
        run: |
          release_arguments=(--accept-suggested)
          if [[ "$SKIP_UNPUBLISHED" == "true" ]]; then
            release_arguments+=(--skip-unpublished)
          fi
          pnpm create-version "${release_arguments[@]}"
        env:
          SKIP_UNPUBLISHED: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_unpublished }}
