name: Release
run-name: "golfo-rp release ${{ inputs.tag }} ${{ inputs.sha }}"

# `pnpm create-version` (ci.workflow in golfo-rp.config.js) bumps and pushes the
# version commit and tag locally, then dispatches this workflow on that tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión creada desde local"
        required: true
        type: string
      tag:
        description: "Tag exacto del release"
        required: true
        type: string
      sha:
        description: "Commit exacto del tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: golfo-ui-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      HUSKY: "0"
    steps:
      - name: Checkout del release
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: true
      # Only Git runs here: the dispatched identity is verified before any project code gets the OIDC permission.
      - name: Verificar identidad del release
        env:
          GOLFO_RP_RELEASE_VERSION: ${{ inputs.version }}
          GOLFO_RP_RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Release no autorizado::$1"; exit 1; }
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          sha_pattern='^[a-f0-9]{40,64}$'
          [[ "$GOLFO_RP_RELEASE_VERSION" =~ $version_pattern ]] || fail "El input version no es una versión estable X.Y.Z; no se instaló nada."
          [[ "$RELEASE_TAG" == "v$GOLFO_RP_RELEASE_VERSION" ]] || fail "El input tag no es el tag de release v$GOLFO_RP_RELEASE_VERSION; no se instaló nada."
          [[ "$GOLFO_RP_RELEASE_SHA" =~ $sha_pattern ]] || fail "El input sha no es un commit completo; no se instaló nada."
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main" || fail "No se pudo traer origin/main para verificar $RELEASE_TAG."
          tag_sha="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}")" || fail "$RELEASE_TAG no existe como tag en origin."
          [[ "$tag_sha" == "$GOLFO_RP_RELEASE_SHA" ]] || fail "$RELEASE_TAG apunta a $tag_sha, no al commit $GOLFO_RP_RELEASE_SHA enviado."
          [[ "$(git rev-parse HEAD)" == "$GOLFO_RP_RELEASE_SHA" ]] || fail "El checkout no está en el commit $GOLFO_RP_RELEASE_SHA de $RELEASE_TAG."
          git merge-base --is-ancestor "$GOLFO_RP_RELEASE_SHA" "refs/remotes/origin/main" || fail "El commit $GOLFO_RP_RELEASE_SHA de $RELEASE_TAG no está en origin/main."
      # release:prepare does not run the browser suite: publication waits for the CI of this exact
      # commit (sharded Playwright included) and stops when it fails or does not finish in time.
      - name: Esperar el CI del commit del release
        env:
          GH_TOKEN: ${{ github.token }}
          GOLFO_RP_RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while :; do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$GOLFO_RP_RELEASE_SHA" --limit 1 --json status,conclusion,url --jq '.[0] // empty')"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              conclusion="$(jq -r .conclusion <<<"$run")"
              url="$(jq -r .url <<<"$run")"
              [[ "$conclusion" == "success" ]] || { echo "::error title=CI del release en rojo::El CI de $GOLFO_RP_RELEASE_SHA terminó en $conclusion ($url); no se publica."; exit 1; }
              echo "CI de $GOLFO_RP_RELEASE_SHA en verde: $url"
              break
            fi
            (( SECONDS < deadline )) || { echo "::error title=CI del release sin terminar::El CI de $GOLFO_RP_RELEASE_SHA no terminó en 30 minutos; no se publica."; exit 1; }
            sleep 30
          done
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the npm client for trusted publishing
        run: npm install --global npm@11.5.1
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      - name: Checks y publicación del release
        env:
          GOLFO_RP_RELEASE_VERSION: ${{ inputs.version }}
          GOLFO_RP_RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: pnpm create-version --ci-release "$RELEASE_TAG"
