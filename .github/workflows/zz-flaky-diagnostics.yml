# TEMPORARY: reproduces the WebKit mobile flakes on Linux runners; removed before merge.
name: Flaky diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose:
    name: diagnose (${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps webkit
      # Saturates the runner CPU so stalled frames show up far more often than in a normal run.
      - run: for i in 1 2 3 4; do (nohup timeout 1500 sh -c 'while :; do :; done' > /dev/null 2>&1 &); done
      - run: pnpm exec playwright test --project=webkit-mobile --reporter=line --workers=2 tests/browser/zz-flaky-diagnostics.spec.ts tests/browser/action-buttons.spec.ts:98 tests/browser/arc-admissions.spec.ts:164 --repeat-each=1
        env:
          DIAG_REPEATS: "60"
