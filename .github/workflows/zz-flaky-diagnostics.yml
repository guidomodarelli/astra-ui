# TEMPORARY: reproduces the WebKit mobile flakes on Linux runners; removed before merge.
name: Flaky diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose:
    name: diagnose (${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec playwright test --project=webkit-mobile --repeat-each=2 --reporter=line
